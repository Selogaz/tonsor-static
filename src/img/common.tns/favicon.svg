<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="TONSOR">
<!-- Растр вместо <text>: браузер не подгружает веб-шрифт DM Serif Text для рендера
     иконки вкладки, поэтому буква T. отрисована как PNG-тайл, вшитый data-URI. -->
<image href="data:image/png;base64," x="0" y="0" width="128" height="128"/>
</svg>
