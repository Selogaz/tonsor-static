
<section class="gift" id="poukaz">
  <div class="gift__media">
    <picture class="gift__media-pic">
      <source media="(max-width: 575px)" srcset="./img/gift.tns/certificate-mobile@2x.webp" type="image/webp">
      <source media="(max-width: 575px)" srcset="./img/gift.tns/certificate-mobile@2x.jpg">
      <source srcset="./img/gift.tns/certificate-desktop@2x.webp" type="image/webp">
      <img class="gift__media-img" src="./img/gift.tns/certificate-desktop@2x.jpg" alt="Dárkový poukaz TONSOR" width="968" height="680" loading="lazy" decoding="async">
    </picture>
  </div>

  <div class="container gift__container">
    <div class="gift__content" data-aos="fade-up">
      <h2 class="gift__title section-title"><span class="section-title__accent">Dárkový</span> poukaz TONSOR</h2>

      <p class="gift__lead">Darujte důležitému muži sebevědomí a upravený vzhled. <strong class="gift__lead-accent">Od 500 Kč</strong></p>

      <ul class="gift__checks">
        <li class="gift__check">
          <svg class="gift__check-icon" width="20" height="20"><use href="./img/sprite.svg#check-sym"></use></svg>
          <span class="gift__check-text">Zaslání e-mailem</span>
        </li>
        <li class="gift__check">
          <svg class="gift__check-icon" width="20" height="20"><use href="./img/sprite.svg#check-sym"></use></svg>
          <span class="gift__check-text">Na jakoukoli službu TONSOR</span>
        </li>
      </ul>

      <a class="gift__cta button button--solid" href="#">Koupit dárkový poukaz</a>
    </div>
  </div>
</section>
